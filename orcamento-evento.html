<style>

*{box-sizing:border-box;margin:0;padding:0;}

label .req{color:var(--red);}
input,select,textarea{width:100%;font-family:Arial,sans-serif;font-size:15px;color:var(--ink);background:#fbf8f2;border:1px solid var(--line);border-radius:10px;padding:12px 13px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:#fff;}
textarea{min-height:76px;resize:vertical;}

.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;}
.btn.wa{background:#1f9d55;box-shadow:0 6px 18px rgba(31,157,85,.3);display:inline-block;text-decoration:none;margin-top:16px;}
.grupo{margin-top:24px;} .grupo h3{font-weight:600;font-size:19px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}

.it .ck{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-weight:700;color:#fff;}
.it.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(169,42,43,.25);} .it.on .ck{background:var(--red);border-color:var(--red);}

.bdg{font-family:Arial,sans-serif;font-size:9px;font-weight:bold;border-radius:10px;padding:1px 6px;background:#e3f0df;color:var(--green);margin-left:4px;vertical-align:middle;}
.resumo{font-family:Arial,sans-serif;font-size:14px;margin-top:14px;}
.resumo table{width:100%;border-collapse:collapse;} .resumo td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;} .resumo td.v{text-align:right;white-space:nowrap;}
.resumo .tot td{font-weight:700;font-size:18px;border-bottom:none;padding-top:12px;color:var(--red);font-family:'Fraunces',Georgia,serif;}
.cond{font-family:Arial,sans-serif;font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px;padding-left:16px;}
.err{display:none;color:var(--red);font-family:Arial,sans-serif;font-size:13px;margin-top:12px;}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(80,55,20,.10);z-index:20;display:none;}
.bar .in{max-width:980px;margin:0 auto;padding:10px 18px;font-family:Arial,sans-serif;font-size:12px;color:var(--muted);line-height:1.35;}
.bar b{display:block;font-size:19px;color:var(--red);font-family:'Fraunces',Georgia,serif;}
.state{text-align:center;color:var(--muted);font-family:Arial,sans-serif;padding:30px;}

<script>
const SUPA="https://mvjbsdpfjhywhaonvpfl.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12amJzZHBmamh5d2hhb252cGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MDk2OTAsImV4cCI6MjA5NTM4NTY5MH0.i_3sqgQa6umsIYBmAwWz_NP6nYuT3GfIZid24zHXSEI";
const WHATS="555121605886";
const LOCAIS=[
  {id:'ccmq',nome:'Lola CCMQ',txt:'7º andar da Casa de Cultura Mario Quintana, no Centro Histórico'},
  {id:'mac',nome:'Lola MAC',txt:'jardim do Museu de Arte Contemporânea do RS, no Floresta'},
  {id:'outro',nome:'Outro local',txt:'a gente leva o Lola até você: casa, empresa, espaço de eventos'}
];
const PASSOS=['local','quando','tipo','pessoas','tempo','detalhes','menu','enviar'];
let PAC=[], ITENS=[], FICHAS=[], COMFOTO=new Set(), FOTOS={};
const S={passo:0,local:'',espaco:'',endereco:'',data:'',hora:'',pacote:null,pax:'',horas:null,det:{ocasiao:'',exclusividade:'',nota:'nao',som:'',decoracao:'',restricoes:''},obs:'',esc:{},nome:'',tel:'',email:''};

function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function money(v){return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function api(path){return fetch(SUPA+'/rest/v1/'+path,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}}).then(function(r){return r.ok?r.json():Promise.reject(new Error(r.status));});}
const STOP=['un','und','unid','unidade','evento','eventos','mini','porcao','kg','gr','g','individual','nova','novo','de','da','do','e','com','pp','porcoes'];
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\d+\s*(gr|g|ml|kg)\b/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(function(w){return w&&STOP.indexOf(w)<0;}).join(' ');}
function toks(n){return n.split(' ').filter(Boolean).map(function(w){return w.length>4?w.replace(/s$/,''):w;});}
function sem(A,B){if(!A.length||!B.length)return 0;var m=0;A.forEach(function(a){if(B.some(function(b){return a===b||(a.length>=4&&b.length>=4&&(a.indexOf(b)===0||b.indexOf(a)===0));}))m++;});if(m<Math.min(A.length,B.length))return 0;return m/Math.max(A.length,B.length);}
function fichaDe(c){if(c.ficha_id)return c.ficha_id;var A=toks(norm(c.nome)),best=null,bs=0;FICHAS.forEach(function(f){var s=sem(A,f._t);if(s>bs||(s===bs&&best&&COMFOTO.has(f.id)&&!COMFOTO.has(best.id))){bs=s;best=f;}});return bs>=0.6&&best?best.id:null;}
function nomeSite(n){return String(n||'').replace(/\b(UN|UND|EVENTO|Evento|eventos|Eventos)\b/g,'').replace(/\b\d+\s?(gr|g|ml)\b/gi,'').replace(/\s{2,}/g,' ').trim();}

async function carregar(){
  const r=await Promise.all([
    api('lola_eventos_pacotes?ativo=eq.true&select=*&order=ordem'),
    api('lola_eventos_itens?ativo=eq.true&publico=eq.true&select=*&order=nome'),
    api('lola_fichas_tecnicas?ativo=eq.true&select=id,nome').catch(function(){return [];}),
    api('lola_fichas_fotos?select=ficha_id&limit=5000').catch(function(){return [];})
  ]);
  PAC=r[0]; ITENS=r[1].map(function(c){c._nome=nomeSite(c.nome);return c;});
  FICHAS=r[2].map(function(f){f._t=toks(norm(f.nome));return f;}); COMFOTO=new Set(r[3].map(function(x){return x.ficha_id;}));
  ITENS.forEach(function(c){var fid=fichaDe(c);c._ficha=(fid&&COMFOTO.has(fid))?fid:null;});
}
function pacote(){return PAC.find(function(p){return p.id===S.pacote;})||null;}
function duracao(){var p=pacote();if(!p)return null;return (p.duracoes||[]).find(function(d){return Number(d.horas)===Number(S.horas);})||null;}
function opcoesGrupo(g){
  var ids=(g.itens||[]).map(String);
  return ITENS.filter(function(c){return ids.length?ids.indexOf(String(c.id))>=0:(g.secoes||[]).indexOf(c.secao)>=0;});
}
function grupos(){var p=pacote();return p?(p.grupos||[]).map(function(g,i){g._i=i;return g;}).filter(function(g){return opcoesGrupo(g).length>0;}):[];}
function pax(){return Math.max(0,parseInt(S.pax,10)||0);}
function precoPP(){var d=duracao();return d&&d.preco_pp!=null&&d.preco_pp!==''?Number(d.preco_pp):null;}
function contas(){var p=pacote(),pp=precoPP();if(!p||pp==null||!pax())return null;var sub=pp*pax(),serv=Math.round(sub*(Number(p.servico_pct)||0))/100;return {pp:pp,sub:sub,serv:serv,tot:sub+serv,pct:Number(p.servico_pct)||0};}
// quantidades: pacote × tempo × convidados, divididas entre os itens escolhidos do grupo (o cliente não vê)
function itensComQtd(){
  var out=[];grupos().forEach(function(g){var esc=S.esc[g._i]||[];if(!esc.length)return;
    var total=pax()*(Number(g.qtd_pp_h)||0)*(Number(S.horas)||0);
    esc.forEach(function(id){var c=ITENS.find(function(x){return String(x.id)===String(id);});if(!c)return;
      out.push({id:c.id,nome:c._nome,secao:c.secao,grupo:g.titulo,qtd:Math.max(1,Math.ceil(total/esc.length))});});});
  return out;
}

/* ---------- etapas ---------- */
function ok(passo){
  switch(passo){
    case 'local':return !!S.local&&(S.local!=='outro'||S.endereco.trim().length>2);
    case 'quando':return !!S.data;
    case 'tipo':return !!pacote();
    case 'pessoas':return pax()>=1;
    case 'tempo':return !!duracao();
    case 'detalhes':return !!S.det.ocasiao;
    case 'menu':return grupos().every(function(g){return (S.esc[g._i]||[]).length===Math.min(Number(g.escolher)||0,opcoesGrupo(g).length);});
    case 'enviar':return S.nome.trim().length>1&&S.tel.replace(/\D/g,'').length>=8;
  }return true;
}
function nav(extra){var p=PASSOS[S.passo];return '<div class="nav">'+(S.passo>0?'<button type="button" class="btn ghost" onclick="voltar()">← Voltar</button>':'<span></span>')
  +(p==='enviar'?'<button type="button" class="btn" id="btnEnviar" onclick="enviar()" '+(ok(p)?'':'disabled')+'>Enviar pro Lola</button>':'<button type="button" class="btn" id="btnNext" onclick="seguir()" '+(ok(p)?'':'disabled')+'>Continuar →</button>')+'</div>'+(extra||'');}
function atualizaNav(){var p=PASSOS[S.passo];var b=document.getElementById(p==='enviar'?'btnEnviar':'btnNext');if(b)b.disabled=!ok(p);barra();}
function seguir(){if(!ok(PASSOS[S.passo]))return;S.passo=Math.min(S.passo+1,PASSOS.length-1);render(true);}
function voltar(){S.passo=Math.max(0,S.passo-1);render(true);}
function render(rolar){
  document.getElementById('prog').innerHTML=PASSOS.map(function(_,i){return '<span class="'+(i<S.passo?'on':i===S.passo?'at':'')+'"></span>';}).join('');
  var el=document.getElementById('app'),p=PASSOS[S.passo],x='';
  if(p==='local'){
    x='<h2>Onde vai ser?</h2><p class="sub">Escolha o lugar e a gente cuida do resto.</p><div class="opts">'+LOCAIS.map(function(l){return '<button type="button" class="opt'+(S.local===l.id?' on':'')+'" onclick="setLocal(\''+l.id+'\')"><b>'+h(l.nome)+'</b><span>'+h(l.txt)+'</span></button>';}).join('')+'</div>';
    if(S.local==='ccmq')x+='<label>No Lola CCMQ, onde vocês preferem?</label><select onchange="S.espaco=this.value"><option value="">Tanto faz — vocês sugerem</option><option value="cupula_ccmq"'+(S.espaco==='cupula_ccmq'?' selected':'')+'>Cúpula (ao ar livre, sujeita ao clima)</option><option value="interno_ccmq"'+(S.espaco==='interno_ccmq'?' selected':'')+'>Salão interno</option></select>';
    if(S.local==='outro')x+='<label>Onde fica? <span class="req">*</span></label><input placeholder="bairro, cidade ou endereço" value="'+h(S.endereco)+'" oninput="S.endereco=this.value;atualizaNav()">';
  }
  if(p==='quando'){
    x='<h2>Quando?</h2><p class="sub">Dia e horário de início.</p><div class="g2"><div><label>Data <span class="req">*</span></label><input type="date" value="'+h(S.data)+'" min="'+new Date().toISOString().slice(0,10)+'" oninput="S.data=this.value;atualizaNav()"></div><div><label>Horário de início</label><input type="time" value="'+h(S.hora)+'" oninput="S.hora=this.value"></div></div>'
     +'<div class="aviso">Data e horário estão <b>sujeitos à disponibilidade</b>. A gente confere a agenda e confirma com você.</div>';
  }
  if(p==='tipo'){
    var l=PAC.filter(function(pc){return !pc.locais||!pc.locais.length||pc.locais.indexOf(S.local)>=0;});
    x='<h2>Que tipo de evento?</h2><p class="sub">Cada formato já vem com o serviço pensado. Depois você escolhe as opções do menu.</p><div class="opts">'+l.map(function(pc){
      var precos=(pc.duracoes||[]).map(function(d){return Number(d.preco_pp);}).filter(function(v){return v>0;});
      return '<button type="button" class="opt big'+(S.pacote===pc.id?' on':'')+'" onclick="setPacote(\''+pc.id+'\')">'+(pc.foto_url?'<div class="ph" style="background-image:url(&quot;'+h(pc.foto_url)+'&quot;)"></div>':'')+'<div class="in"><b>'+h(pc.nome)+'</b><span>'+h(pc.descricao||'')+'</span>'+(precos.length?'<div class="pr">a partir de <b style="font-size:14px;color:var(--ink)">'+money(Math.min.apply(null,precos))+'</b> por pessoa</div>':'')+'</div></button>';}).join('')+'</div>';
  }
  if(p==='pessoas'){
    var pc=pacote();
    x='<h2>Quantas pessoas?</h2><p class="sub">Um número aproximado já ajuda. Dá pra ajustar até 7 dias antes.</p><label>Convidados <span class="req">*</span></label><input type="number" min="1" max="2000" inputmode="numeric" value="'+h(S.pax)+'" oninput="S.pax=this.value;atualizaNav();avisoMin()" style="max-width:220px"><div id="avMin"></div>';
  }
  if(p==='tempo'){
    var pc2=pacote();
    x='<h2>Quanto tempo de serviço?</h2><p class="sub">'+h(pc2.nome)+' para '+pax()+' pessoas.</p><div class="opts">'+(pc2.duracoes||[]).map(function(d){var v=Number(d.preco_pp);return '<button type="button" class="opt'+(Number(S.horas)===Number(d.horas)?' on':'')+'" onclick="setHoras('+Number(d.horas)+')"><b>'+fmtH(d.horas)+'</b>'+(v>0?'<span>'+money(v)+' por pessoa</span>':'<span>valor sob consulta</span>')+'</button>';}).join('')+'</div>';
  }
  if(p==='detalhes'){
    var d=S.det;
    x='<h2>Conta mais um pouco</h2><p class="sub">Isso ajuda a gente a preparar a proposta certa.</p>'
     +'<label>O que vamos celebrar? <span class="req">*</span></label><select onchange="S.det.ocasiao=this.value;atualizaNav()">'+['','Aniversário','Confraternização de empresa','Reunião / encontro de trabalho','Lançamento','Casamento / noivado','Formatura','Outro'].map(function(o){return '<option'+(d.ocasiao===o?' selected':'')+' value="'+h(o)+'">'+(o||'Escolha…')+'</option>';}).join('')+'</select>'
     +(S.local!=='outro'?'<label>O espaço precisa ser só de vocês?</label><select onchange="S.det.exclusividade=this.value"><option value="">Não sei ainda</option><option value="exclusivo"'+(d.exclusividade==='exclusivo'?' selected':'')+'>Sim, exclusivo</option><option value="compartilhado"'+(d.exclusividade==='compartilhado'?' selected':'')+'>Pode ser compartilhado com outros clientes</option></select>':'')
     +'<div class="g2"><div><label>Precisa de nota fiscal?</label><select onchange="S.det.nota=this.value"><option value="nao">Não</option><option value="sim"'+(d.nota==='sim'?' selected':'')+'>Sim</option></select></div>'
     +'<div><label>Música</label><select onchange="S.det.som=this.value"><option value="">Sem música especial</option>'+['Vamos trazer DJ ou banda','Queremos indicação de DJ ou banda','Só som ambiente'].map(function(o){return '<option'+(d.som===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div></div>'
     +'<label>Decoração</label><input placeholder="ex.: vamos trazer flores; queremos algo temático…" value="'+h(d.decoracao)+'" oninput="S.det.decoracao=this.value">'
     +'<label>Restrições alimentares</label><input placeholder="ex.: 3 vegetarianos, 1 sem glúten" value="'+h(d.restricoes)+'" oninput="S.det.restricoes=this.value">'
     +'<label>Mais alguma coisa?</label><textarea maxlength="1500" oninput="S.obs=this.value">'+h(S.obs)+'</textarea>';
  }
  if(p==='menu'){
    var pc3=pacote(),gs=grupos();
    x='<h2>Agora, o menu</h2><p class="sub">Escolha as opções de cada grupo. As quantidades a gente calcula pelo formato, pelo tempo e pelo número de convidados.</p>'
     +(pc3.inclui?'<div class="aviso" style="background:#f3f8f1;border-color:#d5e6cf;color:#3c5a40">Já incluso: '+h(pc3.inclui)+'</div>':'');
    if(!gs.length)x+='<div class="aviso">Esse formato ainda está sem opções no site. Conta pra gente no passo anterior o que você imagina, que montamos juntos.</div>';
    gs.forEach(function(g){var opts=opcoesGrupo(g),n=Math.min(Number(g.escolher)||0,opts.length),esc=S.esc[g._i]||[];
      x+='<div class="grupo"><h3>'+h(g.titulo)+' <small id="cnt'+g._i+'" class="'+(esc.length===n?'ok':'')+'">'+esc.length+' de '+n+' escolhid'+(n>1?'os':'o')+'</small></h3><div class="items">'
        +opts.map(function(c){var on=esc.indexOf(String(c.id))>=0,cheio=!on&&esc.length>=n;
          var foto=c.foto_url?' style="background-image:url(&quot;'+h(c.foto_url)+'&quot;)"':(c._ficha?' data-ficha="'+c._ficha+'"':'');
          return '<button type="button" class="it'+(on?' on':'')+(cheio?' off':'')+'" onclick="escolher('+g._i+',\''+c.id+'\')"><div class="ph"'+foto+'></div><span class="ck">'+(on?'✓':'')+'</span><div class="bd"><div class="nm">'+h(c._nome)+(c.tags||[]).map(function(t){return '<span class="bdg">'+h(t)+'</span>';}).join('')+'</div>'+(c.descricao?'<div class="ds">'+h(c.descricao)+'</div>':'')+'</div></button>';}).join('')+'</div></div>';});
  }
  if(p==='enviar'){
    var c=contas(),pc4=pacote(),loc=LOCAIS.find(function(l){return l.id===S.local;});
    x='<h2>Quase lá</h2><p class="sub">Confira o resumo e deixe seu contato. Seu pedido entra direto na agenda da equipe de eventos.</p>'
     +'<div class="resumo"><table>'
     +'<tr><td>Local</td><td class="v">'+h(loc?loc.nome:'')+(S.local==='outro'?' · '+h(S.endereco):'')+'</td></tr>'
     +'<tr><td>Data</td><td class="v">'+h(S.data.split('-').reverse().join('/'))+(S.hora?' às '+h(S.hora):'')+'</td></tr>'
     +'<tr><td>Formato</td><td class="v">'+h(pc4.nome)+' · '+fmtH(S.horas)+'</td></tr>'
     +'<tr><td>Convidados</td><td class="v">'+pax()+'</td></tr>'
     +grupos().map(function(g){var nm=(S.esc[g._i]||[]).map(function(id){var it=ITENS.find(function(x){return String(x.id)===String(id);});return it?it._nome:'';});return nm.length?'<tr><td>'+h(g.titulo)+'</td><td class="v" style="white-space:normal">'+h(nm.join(', '))+'</td></tr>':'';}).join('')
     +(c?'<tr><td>'+money(c.pp)+' × '+pax()+' pessoas</td><td class="v">'+money(c.sub)+'</td></tr>'+(c.pct?'<tr><td>Serviço ('+c.pct+'%)</td><td class="v">'+money(c.serv)+'</td></tr>':'')+'<tr class="tot"><td>Estimativa</td><td class="v">'+money(c.tot)+'</td></tr>':'<tr><td colspan="2">O valor desse formato a gente passa no orçamento.</td></tr>')
     +'</table></div>'
     +'<div class="g2"><div><label>Seu nome <span class="req">*</span></label><input maxlength="120" autocomplete="name" value="'+h(S.nome)+'" oninput="S.nome=this.value;atualizaNav()"></div><div><label>WhatsApp <span class="req">*</span></label><input maxlength="40" inputmode="tel" autocomplete="tel" placeholder="(51) 9…" value="'+h(S.tel)+'" oninput="S.tel=this.value;atualizaNav()"></div></div>'
     +'<label>E-mail</label><input type="email" maxlength="160" autocomplete="email" value="'+h(S.email)+'" oninput="S.email=this.value">'
     +'<ul class="cond"><li>É uma estimativa: o valor final vem no orçamento, que vale por 30 dias.</li><li>Data e horário sujeitos à disponibilidade.</li><li>O orçamento prevê variação de 5% no número de convidados, pra mais ou pra menos.</li><li>A reserva é confirmada com entrada de 30% do valor total.</li><li>O número de convidados é confirmado com 7 dias de antecedência.</li></ul>'
     +'<div class="err" id="erro"></div>';
  }
  el.innerHTML='<div class="step">'+x+nav()+'</div>';
  if(p==='pessoas')avisoMin();
  fotosVisiveis(); barra();
  if(rolar)window.scrollTo({top:document.querySelector('.wrap').offsetTop-10,behavior:'smooth'});
}
function fmtH(v){v=Number(v);return v===1?'1 hora':(String(v).replace('.',',')+' horas');}
function setLocal(id){S.local=id;var pc=pacote();if(pc&&pc.locais&&pc.locais.length&&pc.locais.indexOf(id)<0){S.pacote=null;S.horas=null;S.esc={};}render();}
function setPacote(id){if(S.pacote!==id){S.esc={};S.horas=null;}S.pacote=id;render();setTimeout(seguir,180);}
function setHoras(v){S.horas=v;render();setTimeout(seguir,180);}
function avisoMin(){var pc=pacote(),el=document.getElementById('avMin');if(!el)return;el.innerHTML=(pc&&pax()&&pax()<(Number(pc.min_pax)||0))?'<div class="aviso">O '+h(pc.nome)+' é pensado pra a partir de '+pc.min_pax+' pessoas. Pode seguir — a gente adapta na proposta.</div>':'';}
function escolher(gi,id){var g=grupos().find(function(x){return x._i===gi;});if(!g)return;var n=Math.min(Number(g.escolher)||0,opcoesGrupo(g).length);
  var a=S.esc[gi]=S.esc[gi]||[];var k=a.indexOf(String(id));if(k>=0)a.splice(k,1);else if(a.length<n)a.push(String(id));else if(n===1){a[0]=String(id);}else return;
  var y=window.scrollY;render();window.scrollTo(0,y);}
function barra(){var c=contas(),b=document.getElementById('bar');if(!c||S.passo<4){b.style.display='none';return;}b.style.display='block';
  document.getElementById('barTxt').textContent=pacote().nome+' · '+fmtH(S.horas)+' · '+pax()+' pessoas · estimativa';document.getElementById('barTot').textContent=money(c.tot);}
let IO=null;
function fotosVisiveis(){const els=document.querySelectorAll('.ph[data-ficha]');if(!('IntersectionObserver' in window)){els.forEach(carregaFoto);return;}
  if(!IO)IO=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){IO.unobserve(e.target);carregaFoto(e.target);}});},{rootMargin:'300px'});els.forEach(function(e){IO.observe(e);});}
async function carregaFoto(el){const id=el.getAttribute('data-ficha');el.removeAttribute('data-ficha');
  if(FOTOS[id]===undefined)FOTOS[id]=api('lola_fichas_fotos?ficha_id=eq.'+id+'&select=foto&order=created_at.asc&limit=1').then(function(r){return r[0]&&r[0].foto||null;}).catch(function(){return null;});
  const u=await FOTOS[id];if(u)el.style.backgroundImage='url("'+u+'")';}
function waTexto(){var pc=pacote(),c=contas(),loc=LOCAIS.find(function(l){return l.id===S.local;});
  var t='*Pedido de orçamento — evento no Lola*\nNome: '+S.nome+'\nOcasião: '+S.det.ocasiao+'\nLocal: '+(loc?loc.nome:'')+(S.local==='outro'?' ('+S.endereco+')':'')+'\nData: '+S.data.split('-').reverse().join('/')+(S.hora?' às '+S.hora:'')+'\nFormato: '+pc.nome+' · '+fmtH(S.horas)+'\nConvidados: '+pax()+'\n';
  grupos().forEach(function(g){var nm=(S.esc[g._i]||[]).map(function(id){var it=ITENS.find(function(x){return String(x.id)===String(id);});return it?it._nome:'';});if(nm.length)t+='\n*'+g.titulo+':* '+nm.join(', ');});
  if(c)t+='\n\nEstimativa: '+money(c.tot);if(S.obs)t+='\n\nObs.: '+S.obs;return t;}
async function enviar(){
  if(!ok('enviar'))return;var b=document.getElementById('btnEnviar'),erro=document.getElementById('erro');b.disabled=true;b.textContent='Enviando…';erro.style.display='none';
  var pc=pacote(),c=contas();
  var det=Object.assign({},S.det,{espaco_ccmq:S.local==='ccmq'?S.espaco:'',endereco:S.local==='outro'?S.endereco:''});
  var body={nome:S.nome.trim(),telefone:S.tel.trim(),email:S.email.trim()||null,ocasiao:S.det.ocasiao||null,data:S.data||null,horario:S.hora||null,pax:pax(),local:S.local,
    formato:pc.nome,pacote_id:pc.id,duracao:fmtH(S.horas),horas:Number(S.horas),preco_pp:c?c.pp:null,detalhes:det,itens:itensComQtd(),
    subtotal:c?Math.round(c.sub*100)/100:null,servico:c?c.serv:null,estimativa:c?Math.round(c.tot*100)/100:null,obs:S.obs.trim()||null};
  var gravou=false;
  try{var r=await fetch(SUPA+'/rest/v1/lola_eventos_pedidos',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});gravou=r.ok;}catch(_e){}
  document.getElementById('bar').style.display='none';document.getElementById('prog').innerHTML='';
  document.getElementById('app').innerHTML='<div class="step" style="text-align:center"><h2>'+(gravou?'Recebemos! 🥂':'Falta só um passo')+'</h2><p class="sub" style="font-size:16px">'
   +(gravou?'Obrigado, '+h(S.nome.split(' ')[0])+'. Seu pedido já está com a equipe de eventos do Lola — a gente confere a agenda e fala com você pelo WhatsApp. Se quiser adiantar a conversa:':'Não consegui registrar seu pedido agora. Toque abaixo pra mandar o resumo direto no nosso WhatsApp:')
   +'</p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+WHATS+'?text='+encodeURIComponent(waTexto())+'">Mandar o resumo no WhatsApp</a></div>';
  window.scrollTo({top:0,behavior:'smooth'});
}
carregar().then(function(){
  if(!PAC.length)throw new Error('sem pacotes');
  render();
}).catch(function(e){console.error(e);
  document.getElementById('app').innerHTML='<div class="step" style="text-align:center"><h2>Vamos montar juntos</h2><p class="sub" style="font-size:16px">Nosso montador de eventos está passando por uma atualização. Chama a gente no WhatsApp que a equipe de eventos monta a proposta com você.</p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+WHATS+'?text='+encodeURIComponent('Oi! Quero fazer um orçamento de evento no Lola.')+'">Falar no WhatsApp</a></div>';
});
</script>
