const STOP=['un','und','unid','unidade','evento','eventos','mini','porcao','kg','gr','g','individual','nova','novo','de','da','do','e','com','pp','porcoes'];
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\d+\s*(gr|g|ml|kg)\b/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(function(w){return w&&STOP.indexOf(w)<0;}).join(' ');}
