function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function money(v){return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function api(path){return fetch(SUPA+'/rest/v1/'+path,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}}).then(function(r){return r.ok?r.json():Promise.reject(new Error(r.status));});}
const STOP=['un','und','unid','unidade','evento','eventos','mini','porcao','kg','gr','g','individual','nova','novo','de','da','do','e','com','pp','porcoes'];
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\d+\s*(gr|g|ml|kg)\b/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(function(w){return w&&STOP.indexOf(w)<0;}).join(' ');}
function toks(n){return n.split(' ').filter(Boolean).map(function(w){return w.length>4?w.replace(/s$/,''):w;});}
function sem(A,B){if(!A.length||!B.length)return 0;var m=0;A.forEach(function(a){if(B.some(function(b){return a===b||(a.length>=4&&b.length>=4&&(a.indexOf(b)===0||b.indexOf(a)===0));}))m++;});if(m<Math.min(A.length,B.length))return 0;var L=A.length>=B.length?A:B,Sm=L===A?B:A;if(L.length>Sm.length&&!Sm.some(function(b){var a=L[0];return a===b||(a.length>=4&&b.length>=4&&(a.indexOf(b)===0||b.indexOf(a)===0));}))return 0;return m/Math.max(A.length,B.length);}
function fichaDe(c){if(c.ficha_id)return c.ficha_id;var A=toks(norm(c.nome)),best=null,bs=0;FICHAS.forEach(function(f){var s=sem(A,f._t);if(s>bs||(s===bs&&best&&COMFOTO.has(f.id)&&!COMFOTO.has(best.id))){bs=s;best=f;}});return bs>=0.6&&best?best.id:null;}
function nomeSite(n){return String(n||'').replace(/\b(UN|UND|EVENTO|Evento|eventos|Eventos)\b/g,'').replace(/\b\d+\s?(gr|g|ml)\b/gi,'').replace(/\s{2,}/g,' ').trim();}

async function carregar(){
  const r=await Promise.all([
    api('lola_eventos_pacotes?ativo=eq.true&select=*&order=ordem').catch(function(e){if(PREVIA){PAC_ORIGEM='padrao';return PAC_PADRAO;}throw e;}),
    PREVIA?api('lola_eventos_itens?ativo=eq.true&select=*&order=nome'):api('lola_eventos_itens?ativo=eq.true&publico=eq.true&select=*&order=nome'),
    api('lola_fichas_tecnicas?ativo=eq.true&select=id,nome').catch(function(){return [];}),
    api('lola_fichas_fotos?select=ficha_id&limit=5000').catch(function(){return [];})
  ]);
  PAC=r[0]; ITENS=r[1].map(function(c){c._nome=nomeSite(c.nome);if(!c.foto_url&&FOTOS_SITE[c.id])c.foto_url=FOTOS_SITE[c.id];return c;});
  FICHAS=r[2].map(function(f){f._t=toks(norm(f.nome));return f;}); COMFOTO=new Set(r[3].map(function(x){return x.ficha_id;}));
  ITENS.forEach(function(c){var fid=fichaDe(c);c._fichaId=fid;c._ficha=(fid&&COMFOTO.has(fid))?fid:null;
    var f=fid?FICHAS.find(function(x){return x.id===fid;}):null;c._fichaNome=f?f.nome:'';c._fichaLigada=!!c.ficha_id;});
}
// prévia: o que falta em cada item
function faltas(c){var a=[];if(c.publico!==true)a.push('fora do site');if(!c.foto_url&&!c._ficha)a.push('sem foto');if(!c.descricao)a.push('sem descrição');
  if(!c._fichaId)a.push('sem ficha');else if(!c._fichaLigada)a.push('ficha achada pelo nome');if(!(Number(c.preco)>0))a.push('sem preço');return a;}
function notaItem(c,g){return g&&g.notas?g.notas[c.id]||'':'';}
function chipsPrevia(c,g){if(!PREVIA)return '';var f=faltas(c);if(revisarPreco(c,g))f.push('preço a revisar');if(notaItem(c,g))f.push('❓ '+notaItem(c,g));return '<div class="pv">'+(f.length?f.map(function(x){return '<span class="'+(x==='ficha achada pelo nome'||x==='preço a revisar'||x.indexOf('❓')===0?'meio':'')+'">'+(x==='preço a revisar'?'⚠️ ':'')+''+h(x)+'</span>';}).join(''):'<span class="okk">pronto ✓</span>')+(c._fichaNome?'<span class="fi">📋 '+h(c._fichaNome)+'</span>':'')+'</div>';}
function painelFaltas(){
  var h2='<h2>O que falta</h2><p class="sub">'+(PAC_ORIGEM==='padrao'?'Os pacotes abaixo são os iniciais (o SQL ainda não foi rodado). ':'')+'Itens com problema por pacote e grupo. Ajuste na 📸 Vitrine e em 📦 Pacotes do site, no app de Eventos.</p>';
  PAC.forEach(function(p){var semPreco=(p.duracoes||[]).filter(function(d){return !(Number(d.preco_pp)>0);}).map(function(d){return fmtH(d.horas);});

    if((p.servicos||[]).length)h2+='<div class="pvg">Serviços: '+h(p.servicos.map(function(x){return x.nome;}).join(' · '))+'</div>';

      h2+='<div class="pvg"><b>'+h(g.titulo)+'</b>'+((g.servicos||[]).length?' <i>(só em: '+h(g.servicos.map(function(id){var x=(p.servicos||[]).find(function(y){return y.id===id;});return x?x.nome:id;}).join(', '))+')</i>':'')+(g.fixo?' — já incluso, sem escolha':g.conjunto?' — conta nos '+g.conjunto+' (mín. '+g.conjunto_min+' no total)':Number(g.escolher)===0?' — opcional':' — cliente escolhe '+(Number(g.max)>Number(g.escolher)?g.escolher+' a '+g.max:g.escolher))+' · '+ops.length+' opções no catálogo, '+noSite+' no site'+(!g.fixo&&noSite<g.escolher?' <span style="color:var(--red)">(precisa de pelo menos '+g.escolher+' no site)</span>':'')
        +(prob.length?'<ul>'+prob.map(function(c){return '<li>'+h(c.nome)+' — '+h(fl(c).join(', '))+'</li>';}).join('')+'</ul>':' · tudo pronto ✓')+'</div>';});
    h2+='</div>';});

function pacote(){return PAC.find(function(p){return p.id===S.pacote;})||null;}
// preço por pessoa para H horas: maior tempo base que cabe em H (ou o menor, se H for menor) + horas a mais × hora_extra_pp
function precoCalc(p,H){
  var t=(p.duracoes||[]).filter(function(d){return Number(d.preco_pp)>0&&Number(d.horas)>0;}).sort(function(a,b){return a.horas-b.horas;});
  if(!t.length||!(H>0))return null;
  var base=t.filter(function(d){return Number(d.horas)<=H;}).pop()||t[0];
  var extraH=Math.max(0,H-Number(base.horas)), he=Number(p.hora_extra_pp)||0;
  return {pp:Number(base.preco_pp)+extraH*he, base:base, extraH:extraH, aCombinar:extraH>0&&!he};
}
function duracao(){var p=pacote();return p&&Number(S.horas)>0?{horas:Number(S.horas)}:null;}
// duração = término − início (se o término for menor, é no dia seguinte), arredondada em 15 min
function calcHoras(){if(!S.hora||!S.fim){S.horas=null;return;}var a=S.hora.split(':'),b=S.fim.split(':');var ini=(+a[0])*60+(+a[1]),fim=(+b[0])*60+(+b[1]);var d=fim-ini;if(d<=0)d+=1440;S.horas=Math.round(d/15)*15/60;}
function viraDia(){if(!S.hora||!S.fim)return false;return S.fim<=S.hora;}
function opcoesGrupo(g){
  var ids=(g.itens||[]).map(String);
  return ITENS.filter(function(c){return ids.length?ids.indexOf(String(c.id))>=0:(g.secoes||[]).indexOf(c.secao)>=0;});
}
function servicos(){var p=pacote();return p?(p.servicos||[]):[];}
function servico(){return servicos().find(function(x){return x.id===S.servico;})||null;}
// grupos do menu: os do pacote que valem pro serviço escolhido (lista vazia = todos os serviços) e que têm opções
function gruposTodos(){var p=pacote();return p?(p.grupos||[]).map(function(g,i){g._i=i;return g;}).filter(function(g){var sv=g.servicos||[];return (!sv.length||!S.servico||sv.indexOf(S.servico)>=0)&&opcoesGrupo(g).length>0;}):[];}
function grupos(){return gruposTodos().filter(function(g){return !g.fixo;});}
function fixos(){return gruposTodos().filter(function(g){return g.fixo;});}
// mínimo e máximo de escolhas do grupo (sem máximo = exatamente o mínimo)
function gMin(g){return Math.min(Number(g.escolher)||0,opcoesGrupo(g).length);}
function gMax(g){return Math.min(Math.max(Number(g.max)||0,Number(g.escolher)||0),opcoesGrupo(g).length);}
function conjuntos(){var m={};grupos().forEach(function(g){if(!g.conjunto)return;var c=m[g.conjunto]=m[g.conjunto]||{nome:g.conjunto,min:0,grupos:[],n:0};c.min=Math.max(c.min,Number(g.conjunto_min)||0);c.grupos.push(g);c.n+=(S.esc[g._i]||[]).length;});return Object.keys(m).map(function(k){return m[k];});}
function revisarPreco(c,g){return (g&&(g.revisar||[]).map(String).indexOf(String(c.id))>=0)&&Number(c.preco)>0;}
function pax(){return Math.max(0,parseInt(S.pax,10)||0);}
function precoPP(){var p=pacote(),c=p?precoCalc(p,Number(S.horas)):null;return c?Math.round(c.pp*100)/100:null;}
function contas(){var p=pacote(),pp=precoPP();if(!p||pp==null||!pax())return null;var sub=pp*pax(),serv=Math.round(sub*(Number(p.servico_pct)||0))/100;return {pp:pp,sub:sub,serv:serv,tot:sub+serv,pct:Number(p.servico_pct)||0};}
// quantidades: pacote × tempo × convidados, divididas entre os itens escolhidos do grupo (o cliente não vê)
function itensComQtd(){
  var out=[];gruposTodos().forEach(function(g){var esc=g.fixo?opcoesGrupo(g).map(function(c){return String(c.id);}):(S.esc[g._i]||[]);if(!esc.length)return;
    var total=pax()*(Number(g.qtd_pp_h)||0)*(Number(S.horas)||0);
    esc.forEach(function(id){var c=ITENS.find(function(x){return String(x.id)===String(id);});if(!c)return;
      out.push({id:c.id,nome:c._nome,secao:c.secao,grupo:g.titulo,qtd:Math.max(1,Math.ceil(total/esc.length))});});});
  return out;
}

function ok(passo){
  if(PREVIA&&passo!=='enviar')return true;
  switch(passo){
    case 'local':return !!S.local&&(S.local!=='outro'||S.endereco.trim().length>2);
    case 'quando':return !!S.data&&!!S.hora&&!!S.fim&&Number(S.horas)>0&&Number(S.horas)<=14;
    case 'tipo':return !!pacote();
    case 'servico':return !servicos().length||!!servico();
    case 'pessoas':return pax()>=1;
    case 'tempo':return !!duracao();
    case 'detalhes':return !!S.det.ocasiao;
    case 'menu':return grupos().every(function(g){var k=(S.esc[g._i]||[]).length;return k>=gMin(g)&&k<=gMax(g);})&&conjuntos().every(function(c){return c.n>=c.min;});
    case 'enviar':return S.nome.trim().length>1&&S.tel.replace(/\D/g,'').length>=8;
  }return true;
}

function irPara(i){S.faltas=false;S.passo=i;if(!S.local)S.local='ccmq';if(i>1&&!S.hora){S.hora='19:00';S.fim='23:00';calcHoras();}if(i>2&&!pax())S.pax='50';if(i>3&&!pacote()&&PAC[0])S.pacote=PAC[0].id;if(i>4&&!servico()&&servicos()[0])S.servico=servicos()[0].id;render(true);}

function tempoInfo(){var el=document.getElementById('tempoInfo');if(!el)return;var p=pacote(),c=p?precoCalc(p,Number(S.horas)):null;
  if(!(Number(S.horas)>0)){el.innerHTML='';return;}

function fmtH(v){v=Number(v);var hh=Math.floor(v),mm=Math.round((v-hh)*60);if(mm===60){hh++;mm=0;}if(!mm)return hh===1?'1 hora':hh+' horas';if(!hh)return mm+' min';return hh+'h'+String(mm).padStart(2,'0');}

function escolher(gi,id){var g=grupos().find(function(x){return x._i===gi;});if(!g)return;var n=gMax(g);
  var a=S.esc[gi]=S.esc[gi]||[];var k=a.indexOf(String(id));if(k>=0)a.splice(k,1);else if(a.length<n)a.push(String(id));else if(n===1){a[0]=String(id);}else return;
