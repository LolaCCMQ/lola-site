<style>
:root{--red:#a92a2b;--gold:#c49955;--ink:#2b2620;--cream:#faf6ef;--line:#e7dcc7;color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Fraunces',Georgia,serif;color:var(--ink);background:var(--cream);}
.head{text-align:center;padding:54px 20px 6px;}
.head .kick{font-family:Arial,Helvetica,sans-serif;letter-spacing:5px;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:bold;}
.head h1{color:var(--red);font-size:44px;font-weight:600;margin:6px 0 6px;font-variation-settings:"opsz" 144;}
.head .sub{font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#8a7f6d;max-width:560px;margin:0 auto;}
.sec{max-width:1080px;margin:0 auto;padding:16px 16px 6px;}
.sec h2{text-align:center;color:var(--gold);font-size:26px;font-weight:600;font-variation-settings:"opsz" 144;margin-top:30px;}
.sec h2 .n{display:block;font-family:Arial,Helvetica,sans-serif;letter-spacing:4px;text-transform:uppercase;font-size:11px;color:#b7a894;font-weight:bold;margin-bottom:2px;}
.sec h2:after{content:"";display:block;width:46px;height:2px;background:var(--gold);opacity:.55;margin:12px auto 2px;}
.masonry{columns:2;column-gap:12px;margin-top:20px;}
@media(min-width:700px){.masonry{columns:3;column-gap:14px;}}
@media(min-width:1000px){.masonry{columns:3;column-gap:16px;}}
.shot{display:block;width:100%;margin:0 0 12px;border:0;padding:0;background:#f0e7d8;border-radius:14px;overflow:hidden;cursor:zoom-in;break-inside:avoid;box-shadow:0 8px 22px rgba(120,90,40,.10);position:relative;line-height:0;}
.shot img{width:100%;height:auto;display:block;transition:transform .45s ease;}
.shot:hover img{transform:scale(1.045);}
@media(min-width:700px){.masonry{margin-top:22px;}.shot{margin-bottom:14px;}}
/* lightbox local (usado quando a página abre sozinha, fora do app) */
.lb{position:fixed;inset:0;background:rgba(20,12,10,.94);display:none;align-items:center;justify-content:center;z-index:9999;}
.lb.on{display:flex;}
.lb img{max-width:92vw;max-height:86vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;cursor:pointer;border-radius:50%;width:52px;height:52px;font:700 30px/1 Arial,sans-serif;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.lb button:hover{background:rgba(255,255,255,.28);}
.lb .prev{left:14px;top:50%;transform:translateY(-50%);}
.lb .next{right:14px;top:50%;transform:translateY(-50%);}
.lb .close{top:14px;right:14px;width:46px;height:46px;font-size:26px;}
.lb .count{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:13px;letter-spacing:.5px;opacity:.85;}
@media(max-width:640px){.lb .prev,.lb .next{width:44px;height:44px;font-size:24px;}}
</style></head>
<body>
<div class="head">
  <div class="kick">Onde a gente fica</div>
  <h1>Ambientes</h1>
  <div class="sub">No topo da Casa de Cultura Mário Quintana: a cúpula aberta com vista pro Guaíba e o salão de tapas com pé‑direito alto. Toque nas fotos para ampliar.</div>
</div>

<div class="sec">
  <h2><span class="n">No terraço</span>A cúpula</h2>
  <div class="masonry" id="galCupula">
    <button class="shot" data-i="0"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-cupula-1.jpg" alt="Terraço na cúpula do Lola CCMQ com sofá e mesas, Porto Alegre"></button>
    <button class="shot" data-i="1"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-cupula-4.jpg" alt="Fim de tarde na cúpula do Lola com o pôr do sol" loading="lazy"></button>
    <button class="shot" data-i="2"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-cupula-3.jpg" alt="Mesas na cúpula do Lola com vista para o Guaíba" loading="lazy"></button>
    <button class="shot" data-i="3"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-cupula-6.jpg" alt="Cúpula do Lola no fim de tarde, movimento de clientes" loading="lazy"></button>
    <button class="shot" data-i="4"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-cupula-5.jpg" alt="Terraço da cúpula do Lola entre as colunas rosadas" loading="lazy"></button>
    <button class="shot" data-i="5"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-cupula-2.jpg" alt="Pôr do sol na cúpula do Lola com vista para o Guaíba" loading="lazy"></button>
  </div>
</div>

<div class="sec">
  <h2><span class="n">Lá dentro</span>O salão</h2>
  <div class="masonry" id="galInterno">
    <button class="shot" data-i="6"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-2.jpg" alt="Salão do Lola Bar de Tapas com letreiro e luminárias" loading="lazy"></button>
    <button class="shot" data-i="7"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-4.jpg" alt="Balcão do Lola com teto vermelho e pé-direito alto" loading="lazy"></button>
    <button class="shot" data-i="8"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-1.jpg" alt="Bar interno do Lola CCMQ com balcão de madeira" loading="lazy"></button>
    <button class="shot" data-i="9"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-5.jpg" alt="Parede com a marca Lola no salão de tapas" loading="lazy"></button>
    <button class="shot" data-i="10"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-7.jpg" alt="Balcão e salão do Lola vistos de longe" loading="lazy"></button>
    <button class="shot" data-i="11"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-3.jpg" alt="Salão do Lola com parede de tijolinho e bancos" loading="lazy"></button>
    <button class="shot" data-i="12"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-8.jpg" alt="Balcão do Lola com a marca e prateleiras" loading="lazy"></button>
    <button class="shot" data-i="13"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-6.jpg" alt="Salão de tapas do Lola CCMQ com mesas postas" loading="lazy"></button>
    <button class="shot" data-i="14"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-9.jpg" alt="Salão do Lola à noite com iluminação aconchegante" loading="lazy"></button>
    <button class="shot" data-i="15"><img src="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/ambiente-interno-10.jpg" alt="Salão e balcão do Lola CCMQ" loading="lazy"></button>
  </div>
</div>

<!-- lightbox local (fallback quando a página abre sozinha) -->
<div class="lb" id="lb">
  <button class="close" aria-label="Fechar">×</button>
  <button class="prev" aria-label="Anterior">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="next" aria-label="Próxima">›</button>
  <div class="count" id="lbCount"></div>
</div>

<script>
(function(){
  var B="https://mvjbsdpfjhywhaonvpfl.supabase.co/storage/v1/object/public/loja/";
  // ordem das fotos = ordem visual (cúpula depois salão), casada com data-i
  var urls=[
    B+"ambiente-cupula-1.jpg",B+"ambiente-cupula-4.jpg",B+"ambiente-cupula-3.jpg",
    B+"ambiente-cupula-6.jpg",B+"ambiente-cupula-5.jpg",B+"ambiente-cupula-2.jpg",
    B+"ambiente-interno-2.jpg",B+"ambiente-interno-4.jpg",B+"ambiente-interno-1.jpg",
    B+"ambiente-interno-5.jpg",B+"ambiente-interno-7.jpg",B+"ambiente-interno-3.jpg",
    B+"ambiente-interno-8.jpg",B+"ambiente-interno-6.jpg",B+"ambiente-interno-9.jpg",
    B+"ambiente-interno-10.jpg"
  ];
  var embedded = (window.self !== window.top);

  // --- lightbox local (standalone) ---
  var lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg'), lbCount=document.getElementById('lbCount');
  var cur=0;
  function show(i){ cur=(i+urls.length)%urls.length; lbImg.src=urls[cur]; lbCount.textContent=(cur+1)+' / '+urls.length; }
  function openLocal(i){ show(i); lb.classList.add('on'); document.body.style.overflow='hidden'; }
  function closeLocal(){ lb.classList.remove('on'); lbImg.src=''; document.body.style.overflow=''; }
  lb.querySelector('.close').addEventListener('click',closeLocal);
  lb.querySelector('.prev').addEventListener('click',function(e){e.stopPropagation();show(cur-1);});
  lb.querySelector('.next').addEventListener('click',function(e){e.stopPropagation();show(cur+1);});
  lb.addEventListener('click',function(e){ if(e.target===lb) closeLocal(); });
  document.addEventListener('keydown',function(e){ if(!lb.classList.contains('on'))return; if(e.key==='Escape')closeLocal(); if(e.key==='ArrowLeft')show(cur-1); if(e.key==='ArrowRight')show(cur+1); });
  var sx=0; lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  lb.addEventListener('touchend',function(e){ var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) show(cur+(dx<0?1:-1)); },{passive:true});

  // --- clique nas fotos ---
  document.querySelectorAll('.shot').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(b.dataset.i,10)||0;
      if(embedded){ try{ window.parent.postMessage({lolaLB:{urls:urls,i:i}},'*'); return; }catch(e){} }
      openLocal(i);
    });
  });
})();
</script>
</body></html>
