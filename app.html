<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lola CCMQ — Porto Alegre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{--red:#a92a2b;--gold:#c49955;--cream:#faf6ef;--head:60px;color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Fraunces',Georgia,serif;background:var(--cream);overflow-anchor:none;}
header.bar{background:var(--red);color:#fbeae0;display:flex;align-items:center;gap:6px;padding:0 14px;height:var(--head);box-shadow:0 2px 12px rgba(0,0,0,.18);position:sticky;top:0;z-index:20;}
.brand{display:flex;align-items:center;cursor:pointer;user-select:none;padding-right:10px;}
.brand img.logo{height:40px;display:block;}
nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
nav::-webkit-scrollbar{height:0;}
nav button{background:none;border:0;color:#f7e3d3;font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:500;letter-spacing:.2px;padding:8px 15px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s;font-variation-settings:"opsz" 40;}
nav button:hover{background:rgba(255,255,255,.12);color:#fff;}
nav button.active{background:#fff;color:var(--red);}
section.block{position:relative;}
section.block + section.block{margin-top:46px;}
iframe.frame{width:100%;border:0;display:block;background:var(--cream);}
.scrolltop{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;border:0;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:20px;line-height:1;display:none;align-items:center;justify-content:center;z-index:30;}
.scrolltop.show{display:flex;}
@media(max-width:640px){
 :root{--head:54px;}
 .brand img.logo{height:32px;}
 nav button{font-size:14px;padding:8px 11px;}
}
</style></head>
<body>
<header class="bar">
 <div class="brand" onclick="location.href='index.html'" title="Voltar para as casas">
   <img class="logo" src="https://drive.google.com/thumbnail?id=1sZwsUOHDYeb8_GFeU8g05DYl6FDUgNXv&sz=w400" alt="Lola CCMQ" referrerpolicy="no-referrer">
 </div>
 <nav id="nav">
   <button data-target="inicio">Início</button>
   <button data-target="menu">Menu</button>
   <button data-target="vinhos">Vinhos</button>
   <button data-target="lojinha">Lojinha</button>
   <button data-target="trabalhe">Trabalhe Conosco</button>
   <button data-target="contato">Contato</button>
 </nav>
</header>

<section class="block" id="inicio"><iframe class="frame" scrolling="no" data-src="home-ccmq.html?embed=1" title="Início"></iframe></section>
<section class="block" id="menu"><iframe class="frame" scrolling="no" data-src="cardapio.html?embed=1" title="Menu"></iframe></section>
<section class="block" id="vinhos"><iframe class="frame" scrolling="no" data-src="vinhos.html?embed=1" title="Vinhos"></iframe></section>
<section class="block" id="lojinha"><iframe class="frame" scrolling="no" data-src="lojinha.html?embed=1" title="Lojinha"></iframe></section>
<section class="block" id="trabalhe"><iframe class="frame" scrolling="no" data-src="trabalhe.html?embed=1" title="Trabalhe Conosco"></iframe></section>
<section class="block" id="contato"><iframe class="frame" scrolling="no" data-src="contato.html?embed=1" title="Contato"></iframe></section>

<button class="scrolltop" id="toTop" title="Voltar ao topo" aria-label="Voltar ao topo">↑</button>

<script>
(function(){
  var nav=document.getElementById('nav');
  var btns=[].slice.call(nav.querySelectorAll('button'));
  var sections=[].slice.call(document.querySelectorAll('section.block'));
  var frames=[].slice.call(document.querySelectorAll('iframe.frame'));

  // ---- auto-altura (mesmo domínio: lemos a altura real do conteúdo) ----
  function fit(f){
    try{ var d=f.contentDocument; if(!d||!d.body) return;
      var h=Math.max(d.body.scrollHeight,d.documentElement.scrollHeight,d.body.offsetHeight);
      if(h>0 && Math.abs((parseInt(f.style.height)||0)-h)>1) f.style.height=h+'px';
    }catch(e){}
  }
  function fitAll(){ frames.forEach(fit); }
  frames.forEach(function(f){
    f.addEventListener('load',function(){
      fit(f);
      try{ var d=f.contentDocument;
        // página única: remove os rodapés repetidos das seções
        try{ var rm=d.querySelectorAll('.foot, footer.foot'); for(var i=0;i<rm.length;i++) rm[i].remove(); fit(f); }catch(e){}
        if(d.fonts&&d.fonts.ready){ d.fonts.ready.then(function(){fit(f);}); }
        [].slice.call(d.querySelectorAll('img')).forEach(function(img){ img.addEventListener('load',function(){fit(f);}); });
        try{ var mo=new MutationObserver(function(){ fit(f); }); mo.observe(d.documentElement,{subtree:true,childList:true,attributes:true,characterData:true}); }catch(e){}
      }catch(e){}
      [200,600,1200,2400].forEach(function(t){ setTimeout(function(){fit(f);},t); });
      scrollToHash();
    });
    f.src=f.dataset.src;
  });
  window.addEventListener('resize',fitAll);

  // ---- navegação até a seção (suave quando o navegador permite; salto garantido sempre) ----
  function headH(){ return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--head'))||60; }
  function maxScroll(){ return Math.max(0, document.documentElement.scrollHeight - window.innerHeight); }
  function topOf(el){ return Math.min(maxScroll(), Math.max(0, el.getBoundingClientRect().top + window.pageYOffset - headH())); }
  function jumpTo(top){ try{ window.scrollTo({top:top,behavior:'smooth'}); }catch(e){ window.scrollTo(0,top); } }
  function go(id){
    var el=document.getElementById(id); if(!el) return;
    fitAll();
    jumpTo(topOf(el));
    var canceled=false;
    function cancel(){ canceled=true; window.removeEventListener('wheel',cancel); window.removeEventListener('touchstart',cancel); }
    window.addEventListener('wheel',cancel,{passive:true,once:true});
    window.addEventListener('touchstart',cancel,{passive:true,once:true});
    // garante/corrige (instantâneo) caso o suave não role ou as imagens mudem a altura
    [450,1000,1800].forEach(function(d){ setTimeout(function(){ if(canceled) return; fitAll(); var t=topOf(el); if(Math.abs(window.pageYOffset-t)>4) window.scrollTo(0,t); },d); });
  }
  btns.forEach(function(b){ b.addEventListener('click',function(){ go(b.dataset.target); }); });

  // ---- destaque do item ativo conforme rola ----
  function setActive(id){ btns.forEach(function(b){ b.classList.toggle('active',b.dataset.target===id); }); }
  if(window.IntersectionObserver){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting) setActive(en.target.id); });
    },{rootMargin:'-45% 0px -50% 0px',threshold:0});
    sections.forEach(function(s){ io.observe(s); });
  }

  // ---- abrir direto numa seção via #hash (ex.: app.html#vinhos) ----
  var hashDone=false;
  function scrollToHash(){
    if(hashDone) return;
    var h=(location.hash||'').replace('#','');
    if(h && document.getElementById(h)){ hashDone=true; setTimeout(function(){ go(h); },400); }
  }
  scrollToHash();

  // ---- botão voltar ao topo ----
  var toTop=document.getElementById('toTop');
  window.addEventListener('scroll',function(){ toTop.classList.toggle('show',window.scrollY>600); });
  toTop.addEventListener('click',function(){ jumpTo(0); });
})();
</script>
</body></html>
