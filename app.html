<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lola CCMQ — Porto Alegre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{--red:#a92a2b;--gold:#c49955;--cream:#faf6ef;color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Fraunces',Georgia,serif;background:var(--cream);display:flex;flex-direction:column;}
header.bar{background:var(--red);color:#fbeae0;display:flex;align-items:center;gap:6px;padding:0 14px;height:60px;flex:0 0 auto;box-shadow:0 2px 12px rgba(0,0,0,.18);position:relative;z-index:5;}
.brand{display:flex;align-items:baseline;gap:8px;cursor:pointer;user-select:none;padding-right:10px;}
.brand .name{font-size:26px;font-weight:600;font-style:italic;line-height:1;color:#fff;font-variation-settings:"opsz" 144;}
.brand .sub{font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#f3cdb0;}
nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
nav::-webkit-scrollbar{height:0;}
nav button{background:none;border:0;color:#f6dccb;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s;}
nav button:hover{background:rgba(255,255,255,.12);color:#fff;}
nav button.active{background:#fff;color:var(--red);}
.frame-wrap{flex:1 1 auto;position:relative;background:var(--cream);}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
@media(max-width:640px){
 header.bar{height:54px;padding:0 8px;}
 .brand .name{font-size:21px;}
 .brand .sub{display:none;}
 nav button{font-size:11px;padding:9px 10px;letter-spacing:1px;}
}
</style></head>
<body>
<header class="bar">
 <div class="brand" onclick="location.href='index.html'" title="Voltar para as casas">
   <span class="name">Lola</span><span class="sub">CCMQ</span>
 </div>
 <nav id="nav">
   <button data-page="home-ccmq.html?embed=1">Início</button>
   <button data-page="cardapio.html?embed=1">Menu</button>
   <button data-page="vinhos.html?embed=1">Vinhos</button>
   <button data-page="lojinha.html?embed=1">Lojinha</button>
   <button data-page="trabalhe.html?embed=1">Trabalhe</button>
   <button data-page="contato.html?embed=1">Contato</button>
 </nav>
</header>
<div class="frame-wrap">
 <iframe id="frame" name="frame" title="Conteúdo Lola CCMQ"></iframe>
</div>
<script>
(function(){
 var nav=document.getElementById('nav');
 var frame=document.getElementById('frame');
 var btns=nav.querySelectorAll('button');
 function load(page,push){
   frame.src=page;
   btns.forEach(function(b){b.classList.toggle('active',b.dataset.page===page);});
   var key=page.split('?')[0].replace('.html','');
   if(push!==false){ try{history.replaceState(null,'','#'+key);}catch(e){} }
 }
 btns.forEach(function(b){ b.addEventListener('click',function(){load(b.dataset.page);}); });
 // open from hash (e.g. app.html#cardapio) or default to Início
 var hash=(location.hash||'').replace('#','');
 var match=null;
 btns.forEach(function(b){ if(b.dataset.page.split('?')[0].replace('.html','')===hash) match=b.dataset.page; });
 load(match||'home-ccmq.html',false);
})();
</script>
</body></html>
